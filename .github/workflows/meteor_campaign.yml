name: Autonomous Meteor Radar Campaign

on:
  schedule:
    # 10, 11, 12 Kasım (Taurid) | 14 Kasım (Kontrol) | 16, 17, 18 Kasım (Leonid)
    # Saat 19:00 UTC = Türkiye Saati ile 22:00
  - cron: '0 19 8-20 11 *'
  workflow_dispatch: # İstersen tek tuşla manuel test başlatmak için

permissions:
  contents: write

jobs:
  shift_1_2200_to_0200:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install numpy scipy pandas matplotlib

      - name: Run Shift 1 (22:00 - 02:00 TRT)
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" -le 12 ]; then SHOWER="Taurid"; elif [ "$DAY" -eq 14 ]; then SHOWER="Control"; else SHOWER="Leonid"; fi
          python meteor_pipeline.py --shower $SHOWER --hours 3.9

      - name: Auto-Commit Shift 1 Data
        run: |
          git config user.name "MeteorBot"
          git config user.email "bot@iztech-astro.org"
          git add data/meteor_catalog.csv data/plots/
          git commit -m "Auto-save Shift 1 meteor data" || echo "No new events"
          git push

  shift_2_0200_to_0600:
    needs: shift_1_2200_to_0200
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install numpy scipy pandas matplotlib

      - name: Run Shift 2 (02:00 - 06:00 TRT) & Update Plots
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" -le 12 ]; then SHOWER="Taurid"; elif [ "$DAY" -eq 14 ]; then SHOWER="Control"; else SHOWER="Leonid"; fi
          python meteor_pipeline.py --shower $SHOWER --hours 3.9
          python meteor_pipeline.py --analyze

      - name: Auto-Commit Shift 2 Data & Final Plots
        run: |
          git config user.name "MeteorBot"
          git config user.email "bot@iztech-astro.org"
          git add data/meteor_catalog.csv data/plots/
          git commit -m "Auto-save Shift 2 data and updated K-S plots" || echo "No changes"
          git push
